<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Within Reach</title>
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/boettiger-lab/geo-agent@v3.35.0/app/assets/favicon.svg">

    <script src="https://unpkg.com/maplibre-gl@5.22.0/dist/maplibre-gl.js"
        integrity="sha384-U054LTKiMIJKEecR8PKFiUZdvkGWHjfPBnen5hSmR9TwfOfgZmKbskC8Rs9dCm/1"
        crossorigin="anonymous"></script>
    <link href="https://unpkg.com/maplibre-gl@5.22.0/dist/maplibre-gl.css" rel="stylesheet"
        integrity="sha384-MGCxhspF/+ufueUgol3FDkiAYQbpSNRhBT0VWHJt64U8qIy9qlnXWx8LAbj6niPH"
        crossorigin="anonymous" />
    <script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"
        integrity="sha384-MjejsnWXHmuz93aE35YWLh5AbS/6ceRB3Vb+ukOwqFzJRTpQ8vvbkLbNV7I0QK4f"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"
        integrity="sha384-nKUDlg+fT0U/eEt4KWP9n034kLe/eVj6k7CVjbu6qfRhJdEyinlGajS9+9AU+UZ5"
        crossorigin="anonymous"></script>

    <link rel="stylesheet" href="../app/style.css">
</head>

<body>
    <header id="app-header">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <h1>Nature Within Reach</h1>
            <span class="brand-sub">What's a short walk, ride or drive from here?</span>
        </div>
        <nav class="header-links">
            <a href="../">Community Profiles</a>
            <a href="https://github.com/boettiger-lab/tpl-cities" target="_blank" rel="noopener">GitHub</a>
        </nav>
    </header>

    <main id="layout">
        <section id="map-wrap">
            <div id="map"></div>
            <div id="map-chips" class="map-overlay" hidden></div>
            <div id="map-legend" class="map-overlay" hidden></div>
            <div id="map-hint" class="map-overlay">Click anywhere in California to start</div>
        </section>

        <aside id="sidebar">
            <div class="sidebar-resize" title="Drag to resize"></div>

            <section id="controls">
                <div class="step" id="step-origin">
                    <div class="step-label"><span class="step-num">1</span> Start from</div>
                    <div class="search">
                        <input id="place-input" type="search" autocomplete="off" spellcheck="false"
                            placeholder="Search an address or place, or click the map"
                            aria-autocomplete="list" aria-controls="place-results">
                        <ul id="place-results" role="listbox" hidden></ul>
                    </div>
                </div>
                <div class="step-row">
                    <div class="step" id="step-mode">
                        <div class="step-label"><span class="step-num">2</span> Travel by</div>
                        <div class="seg" id="mode-buttons" role="radiogroup" aria-label="Travel mode"></div>
                    </div>
                    <div class="step" id="step-time">
                        <div class="step-label"><span class="step-num">3</span> Within</div>
                        <div class="seg" id="time-buttons" role="radiogroup" aria-label="Travel time"></div>
                    </div>
                </div>
                <div class="step" id="step-themes">
                    <div class="step-label"><span class="step-num">4</span> Dimensions</div>
                    <div class="chips" id="theme-buttons" role="group" aria-label="Dimensions"></div>
                </div>
            </section>

            <section id="report" aria-live="polite"></section>
        </aside>
    </main>

    <div id="tooltip" role="tooltip" hidden></div>

    <script type="module" src="../app/access.js"></script>
</body>

</html>
