# Nginx configuration. The shared parts (limits, chat, MCP, tiles, the page and
# the health check) are the snippets in nginx/ of SchmidtDSE/glen-template at the
# tag the Deployment clones, filled in from its env at start-up (glen-ops#340).
# Only this app's own routes belong here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tpl-cities-nginx
  namespace: schmidtdse
data:
  nginx.conf.template: |
    include /etc/nginx/glen/limits.conf;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # MCP through the app, with its token; a static host cannot hold the token,
        # which is why the site moved off GitHub Pages. No chat on this site, so no
        # llm.conf.
        include /etc/nginx/glen/mcp.conf;

        # Static chart pages: a missing file is a 404, not the index page.
        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache";
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
