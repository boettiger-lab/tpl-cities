# Static site only: no LLM proxy, no secrets. The browser talks to the
# public duckdb-geo MCP endpoint configured in config/app.json.
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: biodiversity
  name: tpl-cities-nginx
data:
  default.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
        location /health {
            access_log off;
            return 200 "healthy\n";
        }
    }
