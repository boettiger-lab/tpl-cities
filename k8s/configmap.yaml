# nginx for the static glen-charts site. No secrets in this file: the MCP
# bearer token is substituted into ${MCP_AUTH_TOKEN} at container start from
# Secret duckdb-mcp-auth (see deployment.yaml), and never reaches the browser.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tpl-cities-nginx
  namespace: biodiversity
data:
  nginx.conf.template: |
    # ── Per-client limits on the LLM and MCP paths (glen-ops#246) ──
    # $client_addr is the last X-Forwarded-For entry, the one HAProxy appends
    # from the connection it actually received, so a client cannot choose it by
    # sending its own header. In-cluster callers have no XFF and fall back to
    # $remote_addr. Values from proxy-log measurements (glen-template#50).
    map $http_x_forwarded_for $client_addr {
        "~(?:^|,)\s*(?<last>[^,\s]+)\s*$" $last;
        default $remote_addr;
    }
    limit_req_zone $client_addr zone=llm:10m rate=60r/m;
    limit_req_zone $client_addr zone=mcp:10m rate=60r/m;
    limit_conn_zone $client_addr zone=addr:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Reverse proxy to the shared DuckDB MCP server. The server requires a
        # bearer token (geo-query#453); nginx attaches it so the browser never
        # holds it, and proxies the in-cluster Service rather than the public
        # hostname (glen-ops#73). This is why the site moved off GitHub Pages:
        # a static host cannot hold the token.
        # TEMPORARY (glen-ops, 2026-11-09): NRP's incident-mcp-deny-ingress
        # NetworkPolicy blocks every in-cluster DuckDB MCP server, so this goes to
        # Carl's mirror off NRP, which serves the same public data. Switch back to
        # the in-cluster Service and the duckdb-mcp-auth Secret once NRP lifts it.
        location /api/mcp {
            proxy_set_header X-Real-IP $client_addr;
            limit_req zone=mcp burst=120 nodelay;
            proxy_pass https://duckdb-mcp.carlboettiger.info/mcp;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Host duckdb-mcp.carlboettiger.info;
            proxy_set_header Connection "";
            proxy_set_header Authorization "Bearer ${MCP_AUTH_TOKEN}";
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache";
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
