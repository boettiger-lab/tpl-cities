# nginx for the static glen-charts site. No secrets in this file: the MCP
# bearer token is substituted into ${MCP_AUTH_TOKEN} at container start from
# Secret duckdb-mcp-auth (see deployment.yaml), and never reaches the browser.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tpl-cities-nginx
  namespace: biodiversity
data:
  nginx.conf.template: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Reverse proxy to the shared DuckDB MCP server. The server requires a
        # bearer token (geo-query#453); nginx attaches it so the browser never
        # holds it, and proxies the in-cluster Service rather than the public
        # hostname (glen-ops#73). This is why the site moved off GitHub Pages:
        # a static host cannot hold the token.
        location /api/mcp {
            proxy_pass http://mcp-server-duckdb.biodiversity.svc.cluster.local:8000/mcp;
            proxy_http_version 1.1;
            proxy_set_header Host duckdb-mcp.nrp-nautilus.io;
            proxy_set_header Connection "";
            proxy_set_header Authorization "Bearer ${MCP_AUTH_TOKEN}";
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache";
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
