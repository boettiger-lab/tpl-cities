apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpl-cities
  namespace: schmidtdse
  labels:
    app: tpl-cities
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: tpl-cities
  template:
    metadata:
      labels:
        app: tpl-cities
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: git-clone
        image: alpine/git:2.52.0
        command:
        - sh
        - -c
        - |
          git clone --depth 1 https://github.com/boettiger-lab/tpl-cities.git /tmp/repo
          rm -rf /tmp/repo/.git /tmp/repo/k8s
          cp -r /tmp/repo/. /usr/share/nginx/html/
          # The shared nginx snippets (glen-ops#340), pinned like the GLEN version.
          git clone --depth 1 --branch nginx-v2 https://github.com/SchmidtDSE/glen-template.git /tmp/glen
          cp /tmp/glen/nginx/* /glen-nginx/
        volumeMounts:
        - name: website-content
          mountPath: /usr/share/nginx/html
        - name: glen-nginx
          mountPath: /glen-nginx
      containers:
      - name: nginx
        image: nginx:1.31.9-alpine
        ports:
        - containerPort: 80
        env:
        - name: TMPDIR
          value: "/tmp"
        # Per-app values for the shared nginx snippets (glen-template nginx/render.sh).
        - name: GLEN_APP
          value: "tpl-cities"
        - name: MCP_UPSTREAM
          value: "http://duckdb-mcp.schmidtdse.svc.cluster.local:8000"
        - name: MCP_HOST
          value: "duckdb-mcp.schmidtdse.svc.cluster.local"
        - name: MCP_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: duckdb-mcp-tokens
              key: public
        # Renders the shared snippets and this app's server block, writes
        # config.json, and starts nginx.
        command: ["sh", "/glen-nginx/render.sh"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        volumeMounts:
        - name: website-content
          mountPath: /usr/share/nginx/html
        - name: nginx-template
          mountPath: /nginx-template
          readOnly: true
        - name: nginx-conf-d
          mountPath: /etc/nginx/conf.d
        - name: glen-nginx
          mountPath: /glen-nginx
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: website-content
        emptyDir: {}
      - name: nginx-template
        configMap:
          name: tpl-cities-nginx
      - name: nginx-conf-d
        emptyDir: {}
      - name: glen-nginx
        emptyDir: {}
